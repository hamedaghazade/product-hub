# Alembic Generic Configuration

[alembic]
# مسیر پوشه مایگریشن‌ها
script_location = alembic

# اضافه کردن مسیر پروژه به sys.path جهت ایمپورت مدل‌ها و هسته
prepend_sys_path = .

# فرمت نام‌گذاری فایل‌های نسخه جدید
file_template = %%(rev)s_%%(slug)s

# فعال‌سازی تطابق تایپ‌ها و متادیتا
version_locations = %(here)s/alembic/versions

# آدرس اتصال به پایگاه داده به صورت پیش‌فرض (در env.py بازنویسی می‌شود)
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/product_hub_db

[post_write_hooks]

# تنظیمات لاگ‌گذاری استاندارد Alembic
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S