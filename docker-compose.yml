version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: product_hub_backend
    restart: always
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./product_hub.db
      - BOT_TOKEN=YOUR_TELEGRAM_BOT_TOKEN
      - WEBAPP_URL=https://yourdomain.com
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: product_hub_frontend
    restart: always

  nginx:
    image: nginx:alpine
    container_name: product_hub_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend

volumes:
  backend_data: