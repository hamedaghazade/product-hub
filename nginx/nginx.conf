user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # فشرده‌سازی برای پاسخ‌دهی سریع‌تر Mini App
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name hub.yourdomain.com;

        # مسیر اعتبارسنجی Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # هدایت خودکار تمام درخواست‌ها به HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name hub.yourdomain.com;

        ssl_certificate /etc/letsencrypt/live/hub.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hub.yourdomain.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        # هدرهای امنیتی
        add_header X-Frame-Options "ALLOWALL" always; # ضروری برای بارگذاری در Telegram Mini App
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ۱. فرانت‌اند (Telegram Mini App & Stand-alone Web)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ۲. روت‌های بک‌اند API
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ۳. مسیر دریافت وب‌هوک تلگرام
        location /webhook/telegram {
            proxy_pass http://backend:8000/webhook/telegram;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}